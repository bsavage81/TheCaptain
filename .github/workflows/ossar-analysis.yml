# Replaces inherited OSSAR/.NET 3.1 tooling with a pinned Python dependency audit.
name: Dependency security audit
on:
  push:
  pull_request:
  schedule:
    - cron: '41 15 * * 1'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit -r requirements-dev.txt --no-deps --disable-pip
