name: Inspect Captain deployment
on:
  workflow_dispatch:
  push:
    branches: [codex/fix-captain-deployment]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install existing pinned runtime dependencies for secure console inspection
        run: python -m pip install -r requirements.txt
      - name: Restart Captain through verified API and verify the deployed source
        env:
          PANEL_URL: ${{ secrets.PANEL_URL }}
          PANEL_API_KEY: ${{ secrets.API_KEY }}
          PANEL_SERVER_ID: ${{ secrets.SERVER_ID_MAIN }}
        run: python scripts/panel_deploy.py --restart-and-verify --expected-revision d2eab2a418d5e00ad2ca3a71f55a6ed2b2a12b58
