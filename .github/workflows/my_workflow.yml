name: Sync The Captain with Panel

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: captain-production-deployment
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'bsavage81/TheCaptain' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Restart Captain and verify actual source and ready revision
        env:
          PANEL_URL: ${{ secrets.PANEL_URL }}
          PANEL_API_KEY: ${{ secrets.API_KEY }}
          PANEL_SERVER_ID: ${{ secrets.SERVER_ID_MAIN }}
        run: python scripts/panel_deploy.py --restart-and-verify --expected-revision "$GITHUB_SHA"
